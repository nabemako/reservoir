name: Test Reservoir Computing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scikit-learn matplotlib
    
    - name: Run Reservoir Computing tests
      run: |
        python reservoir_computing.py
    
    - name: Upload visualization results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reservoir_computing_results_py${{ matrix.python-version }}
        path: reservoir_computing_results.png
        retention-days: 30
    
    - name: Check if results file exists
      if: always()
      run: |
        if [ -f reservoir_computing_results.png ]; then
          echo "✓ Visualization successfully generated"
          ls -lh reservoir_computing_results.png
        else
          echo "✗ Visualization not generated"
        fi
